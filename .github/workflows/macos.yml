name: macOS build

# Builds an Apple Silicon (arm64) Anix from the macos branch and publishes it as the
# fork's latest release: the .dmg for a first install, plus the app as .app.tar.gz and
# mac-update.json, which the app's Settings › Check for updates reads to update itself in place.
# The backend tests can run on macOS first (RUN_MAC_TESTS below); a failure stops the release.
# The embedded player's LGPL libmpv (scripts/build-libmpv-lgpl-macos.sh) comes from the Actions
# cache filled by macos-libmpv.yml and is bundled in Contents/Frameworks. Pushes to other
# branches (mac-embedded-mpv) build a test .dmg as an artifact and publish nothing.
on:
  push:
    branches: [macos, mac-embedded-mpv]
    # Documentation-only commits change nothing in the app, so they make no new build.
    paths-ignore:
      - '**.md'
      # The daily sync job is not part of the app.
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Build machine. Intel builds the same Apple Silicon app; use it when GitHub has no Apple Silicon machine free.'
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]

permissions:
  contents: write
  # Reading the libmpv set uploaded by macos-libmpv.yml when the cache has lost it.
  actions: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  # The backend tests on macOS before each release ('true' runs them).
  RUN_MAC_TESTS: 'false'
  ANIX_LIBMPV_DIR: ${{ github.workspace }}/../libmpv-macos
  ANIX_CHECK_USER: ''

jobs:
  build:
    name: Build macOS app
    # GitHub retired its macOS 14 machines in November 2026. A manual run can pick an Intel
    # machine, which cross-builds the same arm64 app from the cached arm64 libmpv.
    runs-on: ${{ inputs.runner || 'macos-15' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags, for the release notes since the previous build.
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          # Build scripts run on the build machine, so Intel and Apple Silicon keep separate caches.
          key: macos-cargo-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-cargo-${{ runner.arch }}-

      - name: Restore libmpv
        id: libmpv
        uses: actions/cache@v4
        with:
          path: ${{ env.ANIX_LIBMPV_DIR }}/out
          key: libmpv-macos-${{ hashFiles('scripts/build-libmpv-lgpl-macos.sh') }}

      # Only when the cache is empty (a changed script whose macos-libmpv.yml run has not
      # finished): the full build, which takes most of an hour.
      # An Intel machine would build an Intel libmpv, which the arm64 app cannot load, so it
      # takes the set uploaded by the newest macos-libmpv.yml run made from the same script.
      - name: Find the uploaded libmpv set
        id: libmpv_run
        if: steps.libmpv.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want=$(git rev-parse HEAD:scripts/build-libmpv-lgpl-macos.sh)
          for line in $(gh api "repos/${{ github.repository }}/actions/workflows/macos-libmpv.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[] | "\(.id),\(.head_sha)"'); do
            id=${line%%,*}; sha=${line#*,}
            if [ "$(git rev-parse "$sha:scripts/build-libmpv-lgpl-macos.sh" 2>/dev/null)" = "$want" ]; then
              echo "id=$id" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::error::No uploaded arm64 libmpv for this script; run macos-libmpv.yml on Apple Silicon first."
          exit 1

      - name: Download the uploaded libmpv set
        if: steps.libmpv_run.outputs.id
        uses: actions/download-artifact@v4
        with:
          name: libmpv-macos
          path: ${{ env.ANIX_LIBMPV_DIR }}/out
          run-id: ${{ steps.libmpv_run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Build libmpv
        if: steps.libmpv.outputs.cache-hit != 'true' && runner.arch == 'ARM64'
        run: |
          brew install nasm pkgconf
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet meson ninja jinja2
          PATH="$RUNNER_TEMP/venv/bin:$PATH" scripts/build-libmpv-lgpl-macos.sh

      - name: Add libmpv to the app
        run: |
          set -euo pipefail
          rm -rf src-tauri/mac-frameworks src-tauri/libmpv-licenses
          mkdir -p src-tauri/mac-frameworks src-tauri/libmpv-licenses
          cp "$ANIX_LIBMPV_DIR"/out/Frameworks/*.dylib src-tauri/mac-frameworks/
          cp "$ANIX_LIBMPV_DIR"/out/licenses/* src-tauri/libmpv-licenses/
          # The set's file names carry library versions, so the bundle list is made here.
          (cd src-tauri && ls mac-frameworks/*.dylib) | jq -R . | jq -s \
            '{bundle: {macOS: {frameworks: .}, resources: ["resources/anime4k/*", "libmpv-licenses/*"]}}' \
            > src-tauri/tauri.libmpv.conf.json
          cat src-tauri/tauri.libmpv.conf.json
          du -sh src-tauri/mac-frameworks

      # A failing test stops here, before anything is built or published, so the app's
      # Check for updates is never offered a build that fails on macOS.
      # Turned off for now to make builds faster; set RUN_MAC_TESTS to 'true' to turn it back on.
      - name: Build the frontend for the tests
        if: env.RUN_MAC_TESTS == 'true'
        run: npm run build

      - name: Run the backend tests on macOS
        if: env.RUN_MAC_TESTS == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Apple Silicon app
        env:
          # Read at compile time by src-tauri/src/clients/mac_update.rs.
          ANIX_MAC_UPDATE_REPO: ${{ github.repository }}
          ANIX_MAC_BUILD: ${{ github.run_number }}
        run: npx --no-install tauri build --target aarch64-apple-darwin --config src-tauri/tauri.libmpv.conf.json

      - name: Check libmpv is in the app
        run: |
          app=$(ls -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app | head -n1)
          ls -la "$app/Contents/Frameworks"
          test -f "$app/Contents/Frameworks/libmpv.2.dylib"
          # Without this entitlement the hardened runtime refuses the ad-hoc signed libmpv.
          codesign -d --entitlements - "$app" 2>&1 | tee /dev/stderr | grep -q disable-library-validation

      - name: Package the release files
        id: pkg
        env:
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="mac-v${version}-b${BUILD}"
          bundle_dir=src-tauri/target/aarch64-apple-darwin/release/bundle
          app=$(ls -d "$bundle_dir"/macos/*.app | head -n1)

          dmg="Anix_${version}_b${BUILD}_macOS_apple_silicon.dmg"
          cp "$(ls "$bundle_dir"/dmg/*.dmg | head -n1)" "$dmg"

          archive="Anix_${version}_b${BUILD}_macOS.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$(dirname "$app")" "$(basename "$app")"
          sha=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          size=$(stat -f%z "$archive")

          prev=$(git tag --list 'mac-v*' --sort=-creatordate | head -n1 || true)
          if [ -n "$prev" ]; then
            notes=$(git log --no-merges --format='- %s' "$prev..HEAD" | head -n 30)
          else
            notes=$(git log --no-merges --format='- %s' -n 15)
          fi
          [ -n "$notes" ] || notes="Rebuild of Anix ${version} for macOS."

          jq -n \
            --arg version "$version" --argjson build "$BUILD" \
            --arg url "https://github.com/${REPO}/releases/download/${tag}/${archive}" \
            --arg sha256 "$sha" --argjson size "$size" --arg notes "$notes" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg release_url "https://github.com/${REPO}/releases/tag/${tag}" \
            '{version: $version, build: $build, url: $url, sha256: $sha256, size: $size, notes: $notes, published_at: $published_at, release_url: $release_url}' \
            > mac-update.json
          cat mac-update.json

          printf '%s\n' "$notes" > notes.md
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dmg=$dmg"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anix-macOS-${{ github.ref_name }}
          path: ${{ steps.pkg.outputs.dmg }}

      - name: Publish release
        if: github.ref == 'refs/heads/macos'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Anix ${{ steps.pkg.outputs.version }} for macOS (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            ${{ steps.pkg.outputs.dmg }}
            ${{ steps.pkg.outputs.archive }}
            mac-update.json
          body_path: notes.md
